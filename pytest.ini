# =============================================================================
# @file:         pytest.ini
# @brief:        pytest configuration: test path, custom markers and default options.
# @details:      Responsibilities: Define the pytest_only, sqlite_only, pg_live and slow markers.
# @dependencies: pytest, tests/conftest.py
# @notes:        The marker descriptions are read by pytest --markers; keep them in sync with tests/conftest.py.
# =============================================================================

[pytest]
# =====================================================
# pytest configuration — Phase C (Task 6: CI)
# =====================================================
#
# Why is this file necessary?
#   There are two sets of tests:
#     • 21 tests in 3 special pytest files (golden regression, RBAC, token/metrics)
#     • 213 tests based on unittest.TestCase (compatible with unittest discover)
#   CI runs both paths separately so that the tests are **not counted twice**:
#       python -m pytest tests/ -m pytest_only -q # 21 tests
#       python -m unittest discover -s tests -p "test_*.py" # 213 tests
#   Files with a marker with an empty `load_tests` are excluded from the unittest path
#   (unittest standard protocol) — details at the top of each file.
#
# Local execution (all three modes are correct):
#       python -m pytest tests/ -q # All 234 tests
#       python -m pytest tests/ -m pytest_only -q
#       python -m pytest tests/ -m "not pytest_only" -q

testpaths = tests

markers =
    pytest_only: فایل‌هایی که فقط با pytest اجرا می‌شوند و از `unittest discover` کنار گذاشته شده‌اند (load_tests خالی) تا در CI دوبار شمرده نشوند.
    sqlite_only: تست‌هایی که SQL یا اسکیمای *مختص SQLite* می‌نویسند. زیر
        `DB_BACKEND=postgresql` به‌صورت خودکار skip می‌شوند (قاعده در
        tests/conftest.py؛ فهرست و دلیل در docs/phase-e-plan.md بند ۵.۳).
        اجرای SQLite هیچ تستی را با این marker رد نمی‌کند ⇒ «۰ skipped» آن مسیر دست‌نخورده است.
    pg_live: requires a real PostgreSQL instance at localhost:5432
    slow: marks tests as slow / heavy rehearsal (deselect with '-m "not slow"')
