global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The Flask application's own metrics endpoint (not the Prometheus API).
  - job_name: printer_app
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:5050"]

  # SNMP exporter is queried via /snmp; replace the documentation-only printer IP
  # with a real device address. Choose a module present in monitoring/snmp.yml.
  # Add one static_configs entry per printer/module as needed.
  - job_name: printer_snmp
    metrics_path: /snmp
    params:
      auth: [public_v2]
    static_configs:
      - targets: ["192.0.2.10"]
        labels:
          snmp_module: printer_std
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [snmp_module]
        target_label: __param_module
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: localhost:9116
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "(.+)"
        target_label: __name__
        replacement: "printer_mib_$1"
