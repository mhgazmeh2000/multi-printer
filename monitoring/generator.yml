            ignore_values: ["-2", "-3"]   # منطق کد: hp.py:258,260 · brother.py:182-183 (+برادر NC: brother.py:13)
            source: core/oid/catalog.py:39
          - oid: 1.3.6.1.2.1.43.8.2.1.13.1.1
            name: tray1_name
            type: DisplayString
            source: core/oid/catalog.py:34
          - oid: 1.3.6.1.2.1.43.8.2.1.13.1.2
