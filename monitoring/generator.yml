            ignore_values: ["-2", "-3"]   # منطق کد: hp.py:258,260 · brother.py:182-183 (+برادر NC: brother.py:13)
            source: core/oid/catalog.py:30
          - oid: 1.3.6.1.2.1.43.11.1.1.9.1.2
            name: toner_remain_2
            type: gauge
            ignore_values: ["-2", "-3"]   # منطق کد: hp.py:258,260 · brother.py:182-183 (+برادر NC: brother.py:13)
            source: core/oid/catalog.py:33
      - name: tray_table
        subtree: 1.3.6.1.2.1.43.8.2.1
        lookups:
          # index → description، از ردیفِ همان جدول در ماتریس (بدون OID تازه)
          - row_index: 1
            label_oid: 1.3.6.1.2.1.43.8.2.1.13.1.1     # tray1_name
          - row_index: 2
            label_oid: 1.3.6.1.2.1.43.8.2.1.13.1.2     # tray2_name
        metrics:                            # 6 سطرِ ماتریس با یک walk
          - oid: 1.3.6.1.2.1.43.8.2.1.9.1.1
            name: tray1_cap
            type: gauge
            ignore_values: ["-2", "-3"]   # منطق کد: hp.py:258,260 · brother.py:182-183 (+برادر NC: brother.py:13)
            source: core/oid/catalog.py:35
          - oid: 1.3.6.1.2.1.43.8.2.1.9.1.2
            name: tray2_cap
            type: gauge
            ignore_values: ["-2", "-3"]   # منطق کد: hp.py:258,260 · brother.py:182-183 (+برادر NC: brother.py:13)
            source: core/oid/catalog.py:38
          - oid: 1.3.6.1.2.1.43.8.2.1.10.1.1
            name: tray1_level
            type: gauge
            ignore_values: ["-2", "-3"]   # منطق کد: hp.py:258,260 · brother.py:182-183 (+برادر NC: brother.py:13)
            source: core/oid/catalog.py:36
          - oid: 1.3.6.1.2.1.43.8.2.1.10.1.2
