#
# monitoring/generator.yml — مشخصاتِ بسته‌بندی SNMP برای PrintGuard (فاز G)
#
# مرجع هر OID: `docs/oid-matrix.md` — که خودش را `tools/build_oid_matrix.py` از **کد**
# می‌سازد. پس هیچ OIDی در این فایل اختراع نشده و هر سطر `source:` به فایل:خط کد دارد.
#
# این فایل «spec» پروژه است، نه ورودیِ باینری `snmp_exporter/generator`:
#   • کلیدهای get / walk(subtree+metrics) / lookups / ignore_values را ابزار خودمان
#     مصرف می‌کند (`tools/check_oid_coverage.py`) و `monitoring/snmp.yml` دستی از
#     همین ردیف‌ها ساخته می‌شود (MIBهای vendor در دسترس نیستند)؛
#   • نام ماژول‌ها 1:1 با collectorهاست تا مقایسهٔ «exporter در برابر collector»
#     (tools/compare_snmp_sources.py) سیب-به-سیب بماند؛
#   • `walk` فقط برای جداول اندیس‌دار: یک PDU به‌جای N درخواست — که کل هدف فاز است
#     (۱۳۲ بسته/دستگاه/چرخه ⇒ چند بسته).
#
# افزودن OID:
#   ۱) اول کد (core/oid/catalog.py یا collector)   ۲) python tools\build_oid_matrix.py --write
#   ۳) ردیف اینجا، با همان `source:`              ۴) python tools\check_oid_coverage.py → ۰
#
# حذف نشانه‌گذاری‌های فارسی/کامنت‌ها مجاز نیست: گیت، کامنت‌های probe-only را هم می‌سنجد.
version: 1

# ── v3 در این spec versus snmp.yml (نگاشتِ رسمی، تصمیم G.4.1) ──────────────────
# این فایل «spec» است و نامِ کلیدهایش را از configِ *generator* می‌گیرد؛ `snmp.yml`
# اما configِ *runtime* است و `config/config.go` (نسخهٔ pin‌شده 0.26.0) این نام‌ها را
# می‌خواهد. پس هنگام ساختِ snmp.yml سه نام نگاشت می‌شود (کدِ نگاشت:
# AUTH_KEY_MAP / AUTH_VALUE_MAP در tools/build_snmp_yml.py):
#   auth_passphrase  → password
#   priv_passphrase  → priv_password
#   priv_protocol: AES128 → AES      (ConfigureSNMP فقط DES/AES/AES192/… را match می‌کند)
# نامِ متغیرهای محیطی (`SNMP_V3_*`) هیچ‌جا عوض نمی‌شود. عمداً این‌جا را هم مثل runtime
# نمی‌نویسیم: شکلِ کلیدها باید همان چیزی بماند که اگر روزی `generator` رسمی با MIBهای
# vendor در دسترس شد، مستقیم بخواندش. سند: docs/snmp-exporter-setup.md §۴.۳ و §۸
auths:
  # نام‌ها با قرارداد فاز G یکی‌اند: printer['exporter_auth'] == f"public_{snmp_version}"
  public_v1:
    community: public
    version: 1
  public_v2:
    community: public
    version: 2
  secure_v3:
    version: 3
    # placeholder؛ مقدار واقعی از env خوانده می‌شود و هرگز commit نمی‌شود
    username: "${SNMP_V3_USERNAME}"
    security_level: authPriv
    auth_protocol: SHA
    auth_passphrase: "${SNMP_V3_AUTH_PASSPHRASE}"
    priv_protocol: AES128
    priv_passphrase: "${SNMP_V3_PRIV_PASSPHRASE}"

modules:
  # ─────────────────────────────────────────────────────────────────────────
