# =============================================================================
# @file:         monitoring/generator.yml
# @brief:        Specification of the SNMP exporter metric modules and OID mappings.
# @details:      Responsibilities: Hold the spec from which monitoring/snmp.yml is built (no OIDs are invented here).
# @dependencies: tools/build_snmp_yml.py, tools/check_oid_coverage.py, tests/test_generator_yml.py
# @notes:        monitoring/snmp.yml is generated from this file by tools/build_snmp_yml.py; edit the spec, then regenerate.
# =============================================================================

#
# monitoring/generator.yml — SNMP package specification for PrintGuard (phase G)
#
# Reference for each OID: `docs/oid-matrix.md` — which itself is `tools/build_oid_matrix.py` from **code**
# makes So no OID is invented in this file and each `source:` line has a file: line of code.
#
# This is the project's "spec" file, not the `snmp_exporter/generator' binary entry:
#   • The get / walk(subtree+metrics) / lookups / ignore_values keys are our own tools
#     consumes (`tools/check_oid_coverage.py`) and `monitoring/snmp.yml` manually from
#     The same rows are created (vendor MIBs are not available);
#   • The names of the modules are 1:1 with collectors to compare "exporter against collector"
#     (tools/compare_snmp_sources.py) stay apples-to-apples;
#   • `walk` for indexed tables only: one PDU instead of N requests — which is the whole purpose of the phase
#     (132 packages/devices/cycles ⇒ multiple packages).
#
# Add OID:
#   1) First code (core/oid/catalog.py or collector) 2) python tools\build_oid_matrix.py --write
#   3) The row here, with the same `source:` 4) python tools\check_oid_coverage.py → 0
#
# Removing Farsi markup/comments is not allowed: Git also measures probe-only comments.
version: 1

# ── v3 in this spec versus snmp.yml (official mapping, decision G.4.1) ────────────────────
# This file is "spec" and takes the name of its keys from the config of *generator*; `snmp.yml`
# But config is *runtime* and `config/config.go` (pinned version 0.26.0) has these names
# wants So, when creating snmp.yml, three names are mapped (mapping code:
# AUTH_KEY_MAP / AUTH_VALUE_MAP in tools/build_snmp_yml.py):
#   auth_passphrase  → password
#   priv_passphrase  → priv_password
#   priv_protocol: AES128 → AES (ConfigureSNMP only matches DES/AES/AES192/…)
# The name of the environment variables (`SNMP_V3_*`) is not changed anywhere. Deliberately like runtime here
# We do not write: the shape of the keys should remain the same as if one day the official ``generator'' with MIBs
# vendor became available, read it directly. Document: docs/snmp-exporter-setup.md §4.3 and §8
auths:
  # The names are the same as the phase G contract: printer['exporter_auth'] == f"public_{snmp_version}"
  public_v1:
    community: public
    version: 1
  public_v2:
    community: public
    version: 2
  secure_v3:
    version: 3
    # place holder The actual value is read from env and never committed
    username: "${SNMP_V3_USERNAME}"
    security_level: authPriv
    auth_protocol: SHA
    auth_passphrase: "${SNMP_V3_AUTH_PASSPHRASE}"
    priv_protocol: AES128
    priv_passphrase: "${SNMP_V3_PRIV_PASSPHRASE}"

