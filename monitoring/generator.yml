            type: gauge
            ignore_values: ["-2", "-3"]   # منطق کد: hp.py:258,260 · brother.py:182-183 (+برادر NC: brother.py:13)
            source: core/oid/catalog.py:29
          - oid: 1.3.6.1.2.1.43.11.1.1.8.1.2
