{% extends "base.html" %}

{% block title %}ویرایشگر داشبورد - {{ dashboard.title }}{% endblock %}

{% block content %}
<style>
@media (max-width: 768px) {
  #builder-toolbar {
    flex-direction: column;
    align-items: stretch !important;
    gap: 12px;
    padding: 12px !important;
  }
  #builder-toolbar > div {
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px !important;
  }
  .grid-stack-item {
    min-height: 280px !important;
  }
}
</style>
<div style="padding: 18px 28px; max-width: 1600px; margin: 0 auto;">
  
  <!-- Builder Action Toolbar -->
  <div id="builder-toolbar" style="display:flex; justify-content:space-between; align-items:center; background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:12px 20px; margin-bottom:18px; box-shadow:0 4px 14px rgba(0,0,0,0.2);">
    <div style="display:flex; align-items:center; gap:14px;">
      <a href="/dashboards" class="btn" style="padding:6px 10px; font-size:12px; text-decoration:none;" title="بازگشت به لیست داشبوردها">➔ لیست</a>
      <div>
        <h3 style="margin:0; font-size:17px; color:var(--text); display:flex; align-items:center; gap:8px;">
          <span>✏️</span> {{ dashboard.title }}
        </h3>
        <span id="save-indicator" style="font-size:11px; margin-top:2px; display:inline-block;">
          <span style="color:var(--green);">✔ همه تغییرات ذخیره شد</span>
        </span>
      </div>
    </div>

    <!-- Actions -->
    <div style="display:flex; align-items:center; gap:8px;">
      <button class="btn btn-cyan" style="padding:6px 10px; font-size:12px;" onclick="if(window.PrintGuardTours) window.PrintGuardTours.startDashboardBuilderTour(true);" title="راهنمای تعاملی این محیط">راهنما 💡</button>
      <button id="btn-undo" class="btn" style="padding:6px 10px; font-size:12px;" onclick="builder.undo()" title="Undo (بازگردانی)">↶ بازگردانی</button>
      <button id="btn-redo" class="btn" style="padding:6px 10px; font-size:12px;" onclick="builder.redo()" title="Redo (انجام مجدد)">↷ مجدد</button>
      <div style="width:1px; height:24px; background:var(--border); margin:0 4px;"></div>
      <button id="btn-add-panel" class="btn btn-green" style="padding:6px 14px; font-size:13px; font-weight:600;" onclick="openAddPanelModal()">＋ افزودن پنل</button>
      <button id="btn-toggle-preview" class="btn btn-cyan" style="padding:6px 12px; font-size:12px;" onclick="builder.togglePreviewMode()">👁 پیش‌نمایش زنده</button>
      <a href="/dashboards/{{ dashboard.uid }}" class="btn" style="padding:6px 12px; font-size:12px; text-decoration:none;" title="مشاهده نمای نهایی">مشاهده نهایی 🔗</a>
    </div>
  </div>

  <!-- 12-Column GridStack Container -->
  <div class="grid-stack" id="builder-grid" style="min-height: 520px; margin-bottom: 30px;"></div>

</div>

<!-- Modal: Add Panel -->
<div class="modal-overlay" id="modal-add-panel" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:9999; align-items:center; justify-content:center;">
  <div class="card" style="width:680px; max-width:92%; max-height:85vh; overflow-y:auto; background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:24px; box-shadow:0 12px 36px rgba(0,0,0,0.6);">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h3 style="margin:0; color:var(--text); font-size:18px;">🧩 افزودن پنل جدید از Panel Registry</h3>
      <button class="btn" style="padding:2px 8px;" onclick="closeAddPanelModal()">×</button>
    </div>

    <!-- Panel Types Selector -->
    <label style="display:block; font-size:12px; color:var(--text2); margin-bottom:8px;">انتخاب نوع پنل:</label>
    <div id="panel-type-selector" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:10px; margin-bottom:18px;">
      <!-- Populated via JS -->
    </div>

    <div style="margin-bottom:14px;">
      <label style="display:block; font-size:12px; color:var(--text2); margin-bottom:6px;">عنوان پنل *</label>
      <input type="text" id="panel-new-title" class="form-input" style="width:100%; box-sizing:border-box;" placeholder="عنوان نمایشی پنل در داشبورد" />
    </div>

    <!-- 3-Level Query Builder Container -->
    <div style="margin-bottom:18px;">
      <label style="display:block; font-size:12px; color:var(--text2); margin-bottom:6px;">تنظیم منبع داده و کوئری (Query Builder):</label>
      <div id="modal-qb-container"></div>
    </div>

    <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
      <button class="btn" onclick="closeAddPanelModal()">انصراف</button>
      <button class="btn btn-green" onclick="submitAddPanel()">افزودن به داشبورد</button>
    </div>
  </div>
</div>

<script>
let builder = null;
let modalQb = null;
let selectedPanelType = "stat";

document.addEventListener("DOMContentLoaded", async function () {
  const dashData = {{ dashboard | tojson | safe }};
  builder = new PrintGuardBuilder("builder-grid", {
    uid: dashData.uid,
    dashboard: dashData,
    isEditable: true,
  });

  // Initialize Query Builder in Modal
  modalQb = new PrintGuardQueryBuilder("modal-qb-container");

  // Load available panel types from registry API
  try {
    const res = await fetch("/api/panels/registry");
    if (res.ok) {
      const data = await res.json();
      renderPanelTypeButtons(data.panels || []);
    }
  } catch (err) {
    console.warn("Could not fetch panel registry:", err);
  }
});

function renderPanelTypeButtons(panels) {
  const container = document.getElementById("panel-type-selector");
  container.innerHTML = "";
  panels.forEach((p, idx) => {
    const btn = document.createElement("div");
    btn.className = `panel-type-card ${idx === 0 ? "active" : ""}`;
    btn.style.cssText = `border:1px solid ${idx === 0 ? "var(--cyan)" : "var(--border)"}; background:var(--bg); border-radius:8px; padding:10px; cursor:pointer; text-align:center; transition:0.2s;`;
    btn.onclick = () => {
      document.querySelectorAll(".panel-type-card").forEach(c => {
        c.style.borderColor = "var(--border)";
      });
      btn.style.borderColor = "var(--cyan)";
      selectedPanelType = p.type;
      document.getElementById("panel-new-title").value = p.display_name;
    };

    btn.innerHTML = `
      <div style="font-size:20px; margin-bottom:4px;">📊</div>
      <div style="font-size:12px; font-weight:600; color:var(--text);">${p.display_name}</div>
      <div style="font-size:10px; color:var(--text3); margin-top:2px;">${p.type}</div>
    `;
    container.appendChild(btn);
  });
  if (panels.length > 0) {
    selectedPanelType = panels[0].type;
    document.getElementById("panel-new-title").value = panels[0].display_name;
  }
}

function openAddPanelModal() {
  document.getElementById("modal-add-panel").style.display = "flex";
  document.getElementById("panel-new-title").focus();
}

function closeAddPanelModal() {
  document.getElementById("modal-add-panel").style.display = "none";
}

async function submitAddPanel() {
  const title = document.getElementById("panel-new-title").value.trim();
  if (!title) {
    alert("لطفاً عنوان پنل را مشخص کنید.");
    return;
  }
  const querySpec = modalQb ? modalQb.getQuerySpec() : {};
  closeAddPanelModal();
  await builder.addPanel(selectedPanelType, title, {}, querySpec);
}
</script>
{% endblock %}
