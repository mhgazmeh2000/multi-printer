# =============================================================================
# @file:         .github/workflows/tests.yml
# @brief:        CI workflow that runs the test suite on Python 3.10 to 3.13.
# @details:      Responsibilities: Run pytest and unittest paths, check that no test is double-counted, and verify golden fixtures.
# @dependencies: GitHub Actions, actions/checkout@v4, actions/setup-python@v5, pytest, unittest, tools/record_golden.py
# @notes:        Tests are hermetic: no network, real clock or external PostgreSQL service is needed.
# =============================================================================

name: tests

# =====================================================
# Phase C — Task 6: CI Safety Tour
# =====================================================
# It guarantees three things:
#   1) 234 green tests on Python 3.10 / 3.11 / 3.12 / 3.13
#   2) Without double counting: 21 pytest-only tests (3 marker files) + 213 tests
#      unittest — each test is counted exactly once (lower proprietary guard)
#   3) fixed byte by byte golden fixtures (difference-zero)
#
# Tests are hermetic: no network/real time/external service. No ancillary services
# (PostgreSQL/Exporter) is not required in this workflow.
# =====================================================

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      # Run-boundary prototype and app integration own disposable local clusters. This is a
      # Linux CI/test dependency only, not an application or Windows dependency.
      - name: Install isolated yield test PostgreSQL
        run: python -m pip install pgserver==0.1.4

      - name: Setup Node for DOM security regressions
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install DOM test dependencies
        run: npm ci

      - name: Panel DOM security regressions
        run: npm test

      # ---------- Route 1: pytest (only 3 marker files = 21 tests) ----------
      - name: pytest — فایل‌های pytest-only (۲۱ تست)
        run: python -m pytest tests/ -m pytest_only -q --color=no

      # ---------- Route 2: unittest (213 tests remaining) ----------
      # pytest-only files with empty load_tests are excluded from this path.
      - name: unittest — سایر تست‌ها (۲۱۳ تست)
        run: |
          python -m unittest discover -s tests -p "test_*.py" 2>&1 | tee "${{ runner.temp }}/unittest.log"

      # ---------- Anti-double counting guard ----------
      # Every unittest-style test must run in exactly one route. The checker compares, per
      # module, unittest's loader with pytest's collection (pytest_only deselected). It runs no
      # tests and does not parse the unittest log, so skipped modules cannot skew it.
      - name: گارد ضد دوبارشماری
        run: python tools/check_test_split.py

      # ---------- golden regression guard ----------
      - name: golden fixtures — تفاضل-صفر (۱۰/۱۰)
        run: python tools/record_golden.py --only all --check

      # ---------- Code coverage (optional, no threshold) ----------
      # Cover files are written outside the repository so that the workspace is not contaminated.
      - name: پوشش کد (اختیاری — بدون threshold)
        continue-on-error: true
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        run: |
          python -m pytest tests/ -q --color=no \
            --cov=core --cov=web --cov-report=term-missing \
            --cov-report=xml:${{ runner.temp }}/coverage.xml

  panel-security-windows:
    name: Panel security / Windows Python 3.14
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      DB_BACKEND: sqlite
      # Keep locale-based subprocess defaults to catch the original cp1252 bug.
      PYTHONUTF8: "0"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Install DOM test dependencies
        run: npm ci
      - name: Panel DOM security regressions
        run: npm test
      - name: Security tests including explicit UTF-8 subprocess IO
        run: python -m unittest -v tests.test_security_hardening
