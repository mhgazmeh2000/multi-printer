# =============================================================================
# @file:         .github/workflows/tests.yml
# @brief:        CI workflow that runs the test suite on Python 3.10 to 3.13.
# @details:      Responsibilities: Run pytest and unittest paths, check that no test is double-counted, and verify golden fixtures.
# @dependencies: GitHub Actions, actions/checkout@v4, actions/setup-python@v5, pytest, unittest, tools/record_golden.py
# @notes:        Tests are hermetic: no network, real clock or external PostgreSQL service is needed.
# =============================================================================

name: tests

# =====================================================
# Phase C — Task 6: CI Safety Tour
# =====================================================
# It guarantees three things:
#   1) 234 green tests on Python 3.10 / 3.11 / 3.12 / 3.13
#   2) Without double counting: 21 pytest-only tests (3 marker files) + 213 tests
#      unittest — each test is counted exactly once (lower proprietary guard)
#   3) fixed byte by byte golden fixtures (difference-zero)
#
# Tests are hermetic: no network/real time/external service. No ancillary services
# (PostgreSQL/Exporter) is not required in this workflow.
# =====================================================

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      # ---------- Route 1: pytest (only 3 marker files = 21 tests) ----------
      - name: pytest — فایل‌های pytest-only (۲۱ تست)
        run: python -m pytest tests/ -m pytest_only -q --color=no

      # ---------- Route 2: unittest (213 tests remaining) ----------
      # pytest-only files with empty load_tests are excluded from this path.
      - name: unittest — سایر تست‌ها (۲۱۳ تست)
        run: |
          python -m unittest discover -s tests -p "test_*.py" 2>&1 | tee "${{ runner.temp }}/unittest.log"

      # ---------- Anti-double counting guard ----------
      # No test shall be omitted or counted twice. The number of unittest-discovered must
      # be exactly equal to pytest set without marker (independent comparison of constant number).
      - name: گارد ضد دوبارشماری
        shell: python
        env:
          UNITTEST_LOG: ${{ runner.temp }}/unittest.log
        run: |
          import os
          import re
          import subprocess
          import sys

          def pytest_collected(marker):
              out = subprocess.run(
                  [sys.executable, "-m", "pytest", "tests/", "-m", marker,
                   "--collect-only", "-q", "--color=no"],
                  capture_output=True, text=True,
              )
              if out.returncode != 0:
                  sys.exit("pytest --collect-only شکست خورد:\n" + out.stdout + out.stderr)
              return sum(1 for line in out.stdout.splitlines() if "::" in line)

          only = pytest_collected("pytest_only")
          rest = pytest_collected("not pytest_only")
          total = only + rest

          log = open(os.environ["UNITTEST_LOG"], encoding="utf-8", errors="replace").read()
          m = re.search(r"^Ran (\d+) tests?", log, re.M)
          if not m:
              sys.exit("سطر «Ran N tests» در لاگ unittest پیدا نشد")
          unittest_n = int(m.group(1))

          print(f"pytest_only={only} | unittest={unittest_n} | pytest کل={total}")
          if only == 0:
              sys.exit("هیچ تست pytest_onlyای کشف نشد (marker/load_tests خراب است)")
          if rest != unittest_n:
              sys.exit(f"دوبارشماری/حذف تست: pytest(بدون marker)={rest} ولی unittest={unittest_n}")
          print(f"✔ بدون دوبارشماری: {only} + {unittest_n} = {total} تست، هر کدام یک بار")

      # ---------- golden regression guard ----------
      - name: golden fixtures — تفاضل-صفر (۱۰/۱۰)
        run: python tools/record_golden.py --only all --check

      # ---------- Code coverage (optional, no threshold) ----------
      # Cover files are written outside the repository so that the workspace is not contaminated.
      - name: پوشش کد (اختیاری — بدون threshold)
        continue-on-error: true
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        run: |
          python -m pytest tests/ -q --color=no \
            --cov=core --cov=web --cov-report=term-missing \
            --cov-report=xml:${{ runner.temp }}/coverage.xml
