# =============================================================================
# @file:         grafana/provisioning/dashboards/dashboards.yml
# @brief:        Grafana provisioning file that loads dashboards from the repository folder.
# @details:      Responsibilities: Tell Grafana where dashboard JSON files live and how often to reload them.
# @dependencies: Grafana >= 9 provisioning, grafana/dashboards/
# @notes:        None.
# =============================================================================

# Grafana dashboard provisioning
# Copy this to /etc/grafana/provisioning/dashboards/

apiVersion: 1

providers:
  - name: "Printer Monitoring"
    orgId: 1
    folder: "Printer Fleet"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
